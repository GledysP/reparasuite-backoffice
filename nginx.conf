server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Para que las rutas de Angular funcionen al refrescar (F5)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PROXY para el Backend (Spring Boot)
location /api/ {
    proxy_pass http://api:8080/api/; # Añadimos /api/ al final para asegurar el mapeo
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    # PROXY para los archivos (según tu SeguridadConfig)
    location /files/ {
        proxy_pass http://api:8080;
    }
}