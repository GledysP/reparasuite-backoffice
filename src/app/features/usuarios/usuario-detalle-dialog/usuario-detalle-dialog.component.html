<div class="rs-detail-shell">
  <div class="rs-detail-header">
    <button
      mat-icon-button
      type="button"
      class="rs-close-btn"
      (click)="cerrar()"
      aria-label="Cerrar"
    >
      <mat-icon>close</mat-icon>
    </button>

    <div class="rs-detail-hero">
      <span class="rs-avatar-circle" [attr.data-tone]="getAvatarTone(data?.nombre)">
        {{ getUserInitials(data?.nombre) }}
      </span>

      <h2 class="rs-user-name">{{ data.nombre }}</h2>
      <p class="rs-user-subtitle">Detalle informativo del usuario</p>
    </div>
  </div>

  <mat-dialog-content class="rs-detail-container">
    <div class="rs-info-grid">
      <div class="rs-info-card">
        <div class="rs-info-label">Correo electrónico</div>
        <div class="rs-info-value">{{ data.email || '—' }}</div>
      </div>

      <div class="rs-info-card">
        <div class="rs-info-label">Rol</div>
        <div class="rs-info-value">
          <span class="rs-role-badge" [ngClass]="getRoleClass(data.rol)">
            {{ data.rol || '—' }}
          </span>
        </div>
      </div>

      <div class="rs-info-card">
        <div class="rs-info-label">Estado</div>
        <div class="rs-info-value">
          <span
            class="rs-status-pill"
            [ngClass]="data.activo ? 'is-active' : 'is-inactive'"
          >
            <mat-icon>{{ data.activo ? 'check_circle' : 'block' }}</mat-icon>
            <span>{{ data.activo ? 'Activo' : 'Inactivo' }}</span>
          </span>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center" class="rs-detail-actions">
    <button mat-stroked-button type="button" (click)="cerrar()" class="rs-btn-minimal">
      Regresar a usuarios
    </button>
  </mat-dialog-actions>
</div>
