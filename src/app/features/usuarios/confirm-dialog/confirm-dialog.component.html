<div class="rs-confirm-shell">
  <div class="rs-confirm-header">
    <div class="rs-alert-icon-bg">
      <mat-icon>delete_outline</mat-icon>
    </div>

    <h2 class="rs-confirm-title">¿Eliminar usuario?</h2>

    <p class="rs-confirm-subtitle">
      Confirmar la eliminación de
      <span class="rs-user-name">{{ data.nombre }}</span>
    </p>
  </div>

  <div class="rs-confirm-footer">
    <button
      mat-button
      type="button"
      (click)="ref.close(false)"
      class="rs-btn-cancel"
    >
      Cancelar
    </button>

    <button
      mat-flat-button
      type="button"
      (click)="ref.close(true)"
      class="rs-btn-confirm"
    >
      <span class="rs-btn-confirm__label">
        <mat-icon>delete</mat-icon>
        <span>Confirmar eliminación</span>
      </span>
    </button>
  </div>
</div>
