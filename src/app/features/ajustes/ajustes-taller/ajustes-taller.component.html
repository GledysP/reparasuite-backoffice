<div class="rs-page-container rs-fade-up">
  <header class="rs-page-head">
    <div class="hdr-title-wrap">
      <h1 class="rs-page-title">Información del Taller</h1>
      <p class="rs-page-subtitle">
        Configura los datos de identidad y contacto que aparecerán en tus documentos oficiales.
      </p>
    </div>
  </header>

  <mat-card class="premium-card-clean">
    <mat-card-content [formGroup]="form" class="rs-content-padding">
      
      <div class="rs-section-head">
        <div class="rs-section-icon">
          <mat-icon>business</mat-icon>
        </div>
        <div class="rs-section-copy">
          <h3 class="rs-section-title">Detalles de la Empresa</h3>
          <p class="rs-section-subtitle">Información institucional de tu taller.</p>
        </div>
      </div>

      <div class="rs-fields-grid-pro">
        <div class="field-group">
          <label>Nombre del Negocio *</label>
          <mat-form-field appearance="outline">
            <mat-icon matPrefix>storefront</mat-icon>
            <input matInput formControlName="nombre" placeholder="Ej.: Reparaciones Express">
          </mat-form-field>
        </div>

        <div class="field-group">
          <label>RIF / ID Fiscal</label>
          <mat-form-field appearance="outline">
            <mat-icon matPrefix>badge</mat-icon>
            <input matInput formControlName="rif" placeholder="J-12345678-0">
          </mat-form-field>
        </div>

        <div class="field-group">
          <label>Teléfono de Contacto</label>
          <mat-form-field appearance="outline">
            <mat-icon matPrefix>call</mat-icon>
            <input matInput formControlName="telefono" placeholder="+58 ...">
          </mat-form-field>
        </div>

        <div class="field-group">
          <label>Email Institucional</label>
          <mat-form-field appearance="outline">
            <mat-icon matPrefix>mail</mat-icon>
            <input matInput formControlName="email" placeholder="taller@ejemplo.com">
          </mat-form-field>
        </div>

        <div class="field-group full-width">
          <label>Dirección Física</label>
          <mat-form-field appearance="outline">
            <mat-icon matPrefix>location_on</mat-icon>
            <input matInput formControlName="direccion" placeholder="Calle, Edificio, Local...">
          </mat-form-field>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions class="rs-settings-actions">
      <button mat-flat-button class="rs-btn rs-btn--primary" (click)="guardar()" [disabled]="form.invalid || cargando">
        <div class="rs-btn__label">
          <mat-icon>{{ cargando ? 'hourglass_empty' : 'check_circle' }}</mat-icon>
          <span>{{ cargando ? 'Guardando...' : 'Guardar Cambios' }}</span>
        </div>
        <div class="rs-btn__shimmer"></div>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
